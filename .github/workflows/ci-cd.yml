# ==============================================================
# CarrefourConnect : CI/CD
#
#   test ─┬─> deploy-test (cluster kind + Helm)          [tous les déclenchements]
#         ├─> build-push (GHCR) ──> security-scan (Trivy) [main et tags v*]
#         └─> sonarcloud (+ couverture mobile)             [main uniquement]
#   mobile (Flutter : analyse, tests) ──> apk              [apk : main uniquement]
#   release (GitHub Release + chart Helm)                  [tags v* : après les tests,
#                                                           le déploiement et le scan]
#
# Tout s'exécute sur des machines virtuelles de GitHub ("runners"), rien en local.
# ==============================================================
name: CI/CD

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*.*.*"]            # ex. v0.2.0 : publie une release
  pull_request:
    branches: [main]
  workflow_dispatch:            # bouton "Run workflow" dans l'onglet Actions

# Un nouveau push sur la même branche annule l'exécution précédente encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège : le jeton GITHUB_TOKEN ne peut que LIRE le dépôt,
# sauf dans les jobs qui demandent explicitement plus (build-push).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR exige des noms en minuscules (le compte s'appelle Fotso12)
  IMAGE_PREFIX: ghcr.io/fotso12/carrefourconnect
  FLUTTER_VERSION: "3.38.10"

jobs:

  # ============================================================
  # 1. Tests backend (Maven) + build et tests Angular
  # ============================================================
  test:
    name: Tests backend + build Angular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Java 25 (Temurin) avec cache Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven          # garde ~/.m2 entre deux exécutions (clé = hash du pom.xml)

      - name: Tests backend (profil test, base H2 en mémoire)
        working-directory: backend
        run: ./mvnw -B test -Dspring.profiles.active=test

      - name: Rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

      - name: Node 24 avec cache npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Dépendances Angular
        working-directory: frontend-web
        run: npm ci --legacy-peer-deps

      - name: Build Angular (production)
        working-directory: frontend-web
        run: npx ng build

      - name: Tests Angular + couverture
        working-directory: frontend-web
        run: npm run test:coverage

      - name: Rapport de couverture Angular
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: frontend-web/coverage/carrefourconnect-web/lcov.info
          if-no-files-found: warn

  # ============================================================
  # 2. Application mobile Flutter (hors Kubernetes, conservée de l'ancien pipeline)
  # ============================================================
  mobile:
    name: Mobile Flutter (analyse + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Version FIGÉE : celle du projet (frontend-mobile/.metadata : 3.38.3), dernier
          # correctif de la série. "stable" seul installerait la dernière version (3.50+),
          # qui exige Gradle 9.3 alors que le projet Android utilise Gradle 8.14.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos
      - name: Tests + couverture
        run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: frontend-mobile/coverage/lcov.info
          if-no-files-found: warn

  # ============================================================
  # 3. Test de déploiement : cluster Kubernetes jetable (kind) dans le runner,
  #    installation du chart Helm, vérification de santé. Le pipeline échoue si
  #    l'application ne démarre pas réellement dans Kubernetes.
  # ============================================================
  deploy-test:
    name: Test de déploiement (kind + Helm)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAMESPACE: carrefourconnect
      RELEASE: carrefourconnect
      CHART: deploy/helm/carrefourconnect
      TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Images construites dans le runner (pas besoin du registre : ce job tourne aussi
      # sur les pull requests). Le cache GitHub Actions est partagé avec build-push.
      - name: Image backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: carrefourconnect-backend:${{ env.TAG }}
          load: true            # rend l'image disponible pour "docker" / "kind load"
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Image frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend-web
          tags: carrefourconnect-frontend:${{ env.TAG }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Cluster kind (Kubernetes 1.36, comme k3d en local)
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ci
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed

      - name: Charger les images dans le cluster
        run: |
          kind load docker-image "carrefourconnect-backend:${TAG}" --name ci
          kind load docker-image "carrefourconnect-frontend:${TAG}" --name ci

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2       # même version que sur le poste de développement

      - name: Lint du chart
        run: |
          FAUX_JWT=$(printf 'x%.0s' {1..64})   # 64 caractères, juste pour passer la validation
          helm lint "$CHART" -f "$CHART/values-dev.yaml"             --set secrets.postgresPassword=x --set "secrets.jwtSecret=$FAUX_JWT" --strict

      # Secrets factices générés à chaque exécution : rien n'est stocké nulle part.
      # "::add-mask::" les masque (***) s'ils apparaissaient dans les logs.
      - name: Valeurs de test (secrets factices)
        run: |
          PG_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 48)        # 96 caractères (>= 64 exigés)
          echo "::add-mask::$PG_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          cat > "$RUNNER_TEMP/values-ci.yaml" <<EOF
          secrets:
            postgresPassword: "$PG_PASSWORD"
            jwtSecret: "$JWT_SECRET"
          backend:
            image: { repository: carrefourconnect-backend, tag: "$TAG", pullPolicy: Never }
            autoscaling: { enabled: false }   # pas de metrics-server dans kind
          frontend:
            image: { repository: carrefourconnect-frontend, tag: "$TAG", pullPolicy: Never }
          ingress:
            enabled: false      # kind n'a pas d'Ingress Controller ; on teste via port-forward
          EOF

      - name: helm install
        run: |
          helm install "$RELEASE" "$CHART" -n "$NAMESPACE" --create-namespace \
            -f "$CHART/values-dev.yaml" -f "$RUNNER_TEMP/values-ci.yaml" \
            --wait --timeout 8m

      - name: Attendre que tous les pods soient prêts
        run: |
          kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
            -l app.kubernetes.io/instance="$RELEASE" --timeout=300s
          kubectl -n "$NAMESPACE" get pods -o wide

      - name: Santé du backend via port-forward (/actuator/health)
        run: |
          kubectl -n "$NAMESPACE" port-forward "svc/${RELEASE}-backend" 8084:8084 > /tmp/port-forward.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8084/actuator/health -o /tmp/health.json; then break; fi
            sleep 2
          done
          echo "Réponse : $(cat /tmp/health.json)"
          grep -q '"status":"UP"' /tmp/health.json
          curl -fsS http://localhost:8084/api/categories > /dev/null && echo "API /api/categories : OK"

      - name: helm test
        run: helm test "$RELEASE" -n "$NAMESPACE" --logs

      # En cas d'échec : tout ce qu'il faut pour comprendre, directement dans les logs du job
      - name: Diagnostic (en cas d'échec)
        if: failure()
        run: |
          echo "::group::Ressources"
          kubectl -n "$NAMESPACE" get all,pvc -o wide || true
          echo "::endgroup::"
          echo "::group::Events (chronologie)"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          for pod in $(kubectl -n "$NAMESPACE" get pods -o name 2>/dev/null); do
            echo "::group::describe $pod"
            kubectl -n "$NAMESPACE" describe "$pod" || true
            echo "::endgroup::"
            echo "::group::logs $pod"
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --tail=200 || true
            kubectl -n "$NAMESPACE" logs "$pod" --all-containers --previous --tail=100 2>/dev/null || true
            echo "::endgroup::"
          done

  # ============================================================
  # 4. Construction et publication des images sur GitHub Container Registry
  # ============================================================
  build-push:
    name: Images -> GHCR (${{ matrix.component }})
    needs: test
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write           # nécessaire pour pousser sur ghcr.io avec GITHUB_TOKEN
    strategy:
      matrix:                   # le même job, lancé deux fois en parallèle
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # jeton temporaire fourni par GitHub, rien à stocker

      # Tags : SHA court du commit (traçable, immuable), latest (dernière version de main,
      # pratique mais mobile) et, sur un tag Git v0.2.0 : 0.2.0 et 0.2 (versions)
      - name: Tags et labels OCI
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # metadata-action ajoute aussi org.opencontainers.image.source : GHCR relie
          # ainsi l'image au dépôt (visible dans la section "Packages" du dépôt)

      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  # ============================================================
  # 5. Scan de vulnérabilités des images publiées (Trivy)
  # ============================================================
  security-scan:
    name: Trivy (${{ matrix.component }})
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read            # lire l'image sur GHCR (même si le paquet est privé)
    strategy:
      fail-fast: false          # scanner les deux images même si l'une échoue
      matrix:
        component: [backend, frontend]
    steps:
      - name: Tag de l'image (SHA court)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Bloquant : échec si une vulnérabilité CRITICAL possède un correctif
      - name: Vulnérabilités CRITICAL corrigeables (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ env.SHORT_SHA }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true  # une faille sans correctif disponible ne bloque pas
          exit-code: "1"
          format: table

      # Informatif : liste les HIGH corrigeables sans faire échouer le pipeline
      - name: Vulnérabilités HIGH corrigeables (informatif)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: "true"   # base déjà téléchargée par l'étape précédente
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ env.SHORT_SHA }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ============================================================
  # 6. Qualité de code SonarCloud (conservé de l'ancien pipeline)
  # ============================================================
  sonarcloud:
    name: SonarCloud
    needs: [test, mobile]
    # S'exécute même si le job mobile a échoué (la couverture mobile sera alors absente)
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # historique complet : Sonar attribue les problèmes aux commits
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compilation backend (Sonar analyse le bytecode Java)
        working-directory: backend
        run: ./mvnw -B compile
      - name: Rapports de couverture
        uses: actions/download-artifact@v8
        with:
          path: rapports
      - name: Ranger les rapports aux emplacements attendus par sonar-project.properties
        run: |
          mkdir -p backend/target/site/jacoco frontend-web/coverage frontend-mobile/coverage
          cp rapports/jacoco-report/jacoco.xml backend/target/site/jacoco/ 2>/dev/null || echo "pas de rapport JaCoCo"
          cp rapports/web-coverage/lcov.info frontend-web/coverage/ 2>/dev/null || echo "pas de couverture web"
          cp rapports/mobile-coverage/lcov.info frontend-mobile/coverage/ 2>/dev/null || echo "pas de couverture mobile"
      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # 7. APK Android (conservé de l'ancien pipeline)
  # ============================================================
  apk:
    name: APK Android
    needs: mobile
    # Sur main, ou à la demande (bouton "Run workflow" / gh workflow run) sur n'importe quelle branche
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Le runner fournit Java 25 par défaut, que Gradle 8.14 (projet Android) ne supporte
      # pas. Le projet Android cible Java 17 (android/app/build.gradle.kts) : on l'impose.
      - name: Java 17 pour Gradle / Android
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Version FIGÉE : celle du projet (frontend-mobile/.metadata : 3.38.3), dernier
          # correctif de la série. "stable" seul installerait la dernière version (3.50+),
          # qui exige Gradle 9.3 alors que le projet Android utilise Gradle 8.14.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK release
        working-directory: frontend-mobile
        run: flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: carrefourconnect-android-apk
          path: frontend-mobile/build/app/outputs/flutter-apk/app-release.apk

  # ============================================================
  # 8. Release : sur un tag v*.*.* (ex. v0.2.0), une fois les tests, le déploiement
  #    sur kind et le scan de sécurité réussis. Crée la GitHub Release avec les notes
  #    du CHANGELOG et le chart Helm empaqueté en pièce jointe.
  # ============================================================
  release:
    name: Release ${{ github.ref_name }}
    needs: [deploy-test, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write           # créer la release et y joindre des fichiers
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Vérifier que le tag correspond à la version du chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(grep '^version:' deploy/helm/carrefourconnect/Chart.yaml | awk '{print $2}')
          echo "Tag : $VERSION / Chart.yaml : $CHART_VERSION"
          test "$VERSION" = "$CHART_VERSION" || { echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version du chart ($CHART_VERSION)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Empaqueter le chart Helm
        run: helm package deploy/helm/carrefourconnect --destination dist

      - name: Notes de version (section du CHANGELOG)
        run: |
          # Lignes entre "## [VERSION]" et la section suivante "## ["
          awk -v titre="## [$VERSION]" '
            index($0, titre) == 1 { dedans = 1; next }   # début de la section de la version
            dedans && index($0, "## [") == 1 { exit }     # début de la section suivante
            dedans { print }
          ' CHANGELOG.md > dist/notes.md
          {
            echo ""
            echo "### Images Docker"
            echo '```'
            echo "docker pull ghcr.io/fotso12/carrefourconnect-backend:${VERSION}"
            echo "docker pull ghcr.io/fotso12/carrefourconnect-frontend:${VERSION}"
            echo '```'
            echo "Chart Helm : \`carrefourconnect-${VERSION}.tgz\` ci-dessous."
          } >> dist/notes.md
          cat dist/notes.md

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/carrefourconnect-${VERSION}.tgz"             --title "CarrefourConnect ${GITHUB_REF_NAME}"             --notes-file dist/notes.md             --verify-tag
