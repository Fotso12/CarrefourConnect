# ==============================================================
# Workflow CI/CD Global — CarrefourConnect
# Build + Test + Deploy: Backend, Frontend Web, Frontend Mobile
# ==============================================================
name: CarrefourConnect CI/CD Global

# Déclencheurs : push ou pull request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================
  # Job 1 : Build, Test et Deploy du Backend Spring Boot
  # ============================================================
  build-backend:
    name: 🔧 Backend Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Build et Tests avec Maven
        run: ./mvnw clean test -Dspring.profiles.active=test

      # Sauvegarde du rapport JaCoCo pour Sonar
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml

      - name: Connexion au Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction et Push de l'image Docker Backend
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-backend:latest

  # ============================================================
  # Job 2 : Build et Deploy du Frontend Web Angular
  # ============================================================
  build-frontend-web:
    name: 🌐 Frontend Web Angular
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Installation des dépendances npm
        working-directory: ./frontend-web
        run: npm ci --legacy-peer-deps

      - name: Build Angular (production)
        working-directory: ./frontend-web
        run: npm run build -- --configuration production

      - name: Tests et Couverture Web
        working-directory: ./frontend-web
        run: npm run test:coverage

      # Sauvegarde du rapport LCOV pour Sonar
      - name: Upload Web Coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: frontend-web/coverage/lcov.info

      - name: Connexion au Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction et Push de l'image Docker Web
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-web:latest

  # ============================================================
  # Job 3 : Build du Frontend Mobile Flutter (APK Android)
  # ============================================================
  build-frontend-mobile:
    name: 📱 Frontend Mobile Flutter
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Configuration de Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances Flutter
        working-directory: ./frontend-mobile
        run: flutter pub get

      - name: Tests et Couverture Mobile
        working-directory: ./frontend-mobile
        run: flutter test --coverage

      # Sauvegarde du rapport LCOV pour Sonar
      - name: Upload Mobile Coverage
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: frontend-mobile/coverage/lcov.info

      - name: Build APK Android (release)
        working-directory: ./frontend-mobile
        run: flutter build apk --release

      - name: Upload de l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: carrefourconnect-android-apk
          path: frontend-mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================
  # Job 4 : Analyse SonarQube Cloud Consolidée (Monorepo)
  # ============================================================
  sonarcloud:
    name: 🔍 SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend-web, build-frontend-mobile]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important pour l'analyse Sonar

      # Téléchargement de tous les rapports de couverture
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      # Réorganisation des fichiers pour correspondre aux chemins configurés
      - name: Move coverage reports to project structures
        run: |
          mkdir -p backend/target/site/jacoco
          mv jacoco-report/jacoco.xml backend/target/site/jacoco/jacoco.xml
          
          mkdir -p frontend-web/coverage
          mv web-coverage/lcov.info frontend-web/coverage/lcov.info
          
          mkdir -p frontend-mobile/coverage
          mv mobile-coverage/lcov.info frontend-mobile/coverage/lcov.info

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
