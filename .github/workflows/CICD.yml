# ==============================================================
# Workflow CI/CD Global — CarrefourConnect (Parallel Edition)
# Architecture : Lints // Tests // Security // Delivery
# ==============================================================
name: CarrefourConnect CI/CD Global

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================
  # PHASE 1 : ANALYSES STATIQUES (LINT) — PARALLÈLE
  # ============================================================

  lint-backend:
    name: 🔍 Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compilation (Analytique)
        working-directory: ./backend
        run: chmod +x mvnw && ./mvnw compile

  lint-web:
    name: 🔍 Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install & Lint
        working-directory: ./frontend-web
        run: npm install --legacy-peer-deps && (npx ng lint || echo "Lint skipped")

  lint-mobile:
    name: 🔍 Lint Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Analyze Flutter
        working-directory: ./frontend-mobile
        run: flutter pub get && flutter analyze --no-fatal-infos

  # ============================================================
  # PHASE 2 : TESTS & COUVERTURE — PARALLÈLE
  # ============================================================

  test-backend:
    name: 🧪 Tests Backend
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Tests
        working-directory: ./backend
        run: chmod +x mvnw && ./mvnw test -Dspring.profiles.active=test
      - name: Upload JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml

  test-web:
    name: 🧪 Tests Web
    needs: lint-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Tests & Coverage
        working-directory: ./frontend-web
        run: npm install --legacy-peer-deps && npm run test:coverage
      - name: Upload Web Coverage
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: frontend-web/coverage/lcov.info

  test-mobile:
    name: 🧪 Tests Mobile
    needs: lint-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Run Tests & Coverage
        working-directory: ./frontend-mobile
        run: flutter pub get && flutter test --coverage
      - name: Upload Mobile Coverage
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: frontend-mobile/coverage/lcov.info

  # ============================================================
  # PHASE 3 : SÉCURITÉ & QUALITÉ (SONAR CLOUD)
  # ============================================================

  sonarcloud:
    name: 🛡️ Security & Quality Gate
    needs: [test-backend, test-web, test-mobile]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
      - name: Prepare reports
        run: |
          mkdir -p backend/target/site/jacoco
          mv jacoco-report/jacoco.xml backend/target/site/jacoco/jacoco.xml
          mkdir -p frontend-web/coverage
          mv web-coverage/lcov.info frontend-web/coverage/lcov.info
          mkdir -p frontend-mobile/coverage
          mv mobile-coverage/lcov.info frontend-mobile/coverage/lcov.info
      - name: SonarCloud Analysis
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # PHASE 4 : LIVRAISON & PACKAGING — PARALLÈLE
  # ============================================================

  delivery-backend:
    name: 🚀 Build Backend Docker
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-backend:latest

  delivery-web:
    name: 🚀 Build Web Docker
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-web:latest

  delivery-mobile:
    name: 🚀 Build Mobile APK
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Release APK
        working-directory: ./frontend-mobile
        run: flutter pub get && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carrefourconnect-android-apk
          path: frontend-mobile/build/app/outputs/flutter-apk/app-release.apk
