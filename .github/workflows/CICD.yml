# ==============================================================
# Workflow CI/CD Global — CarrefourConnect
# Build + Test + Deploy: Backend, Frontend Web, Frontend Mobile
# ==============================================================
name: CarrefourConnect CI/CD Global

# Déclencheurs : push ou pull request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================
  # Job 1 : Build, Test et Deploy du Backend Spring Boot
  # ============================================================
  build-backend:
    name: 🔧 Backend Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1. Récupération du code source
      - uses: actions/checkout@v4

      # 2. Installation de l'environnement Java 17
      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Donner les droits d'exécution au script Maven Wrapper
      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      # 4. Construction et exécution des tests unitaires
      - name: Build et Tests avec Maven
        run: ./mvnw clean test -Dspring.profiles.active=test

      # 5. Connexion au Docker Hub
      - name: Connexion au Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Construction de l'image Docker et envoi sur le registry
      - name: Construction et Push de l'image Docker Backend
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-backend:latest

  # ============================================================
  # Job 2 : Build et Deploy du Frontend Web Angular
  # ============================================================
  build-frontend-web:
    name: 🌐 Frontend Web Angular
    runs-on: ubuntu-latest
    needs: build-backend  # S'exécute après le backend

    steps:
      # 1. Récupération du code source
      - uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      # 3. Installation des dépendances
      - name: Installation des dépendances npm
        working-directory: ./frontend-web
        run: npm ci --legacy-peer-deps

      # 4. Build de production Angular
      - name: Build Angular (production)
        working-directory: ./frontend-web
        run: npm run build -- --configuration production

      # 5. Connexion au Docker Hub
      - name: Connexion au Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Construction de l'image Docker avec Nginx et envoi sur le registry
      - name: Construction et Push de l'image Docker Web
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-web:latest

  # ============================================================
  # Job 3 : Build du Frontend Mobile Flutter (APK Android)
  # ============================================================
  build-frontend-mobile:
    name: 📱 Frontend Mobile Flutter
    runs-on: ubuntu-latest
    needs: build-backend  # S'exécute en parallèle avec le job web, après le backend

    steps:
      # 1. Récupération du code source
      - uses: actions/checkout@v4

      # 2. Installation de Flutter
      - name: Configuration de Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      # 3. Installation des dépendances Flutter
      - name: Installation des dépendances Flutter
        working-directory: ./frontend-mobile
        run: flutter pub get

      # 4. Analyse statique du code (lint)
      - name: Analyse statique Flutter
        working-directory: ./frontend-mobile
        run: flutter analyze --no-fatal-infos

      # 5. Build de l'APK Android en mode release
      - name: Build APK Android (release)
        working-directory: ./frontend-mobile
        run: flutter build apk --release

      # 6. Upload de l'APK comme artefact de build
      - name: Upload de l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: carrefourconnect-android-apk
          path: frontend-mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
