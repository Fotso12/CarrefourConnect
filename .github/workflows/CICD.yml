# ==============================================================
# Workflow CI/CD Global — CarrefourConnect
# Build + Test + Deploy: Backend, Frontend Web, Frontend Mobile
# ==============================================================
name: CarrefourConnect CI/CD Global

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================
  # Job 1 : Backend Spring Boot
  # ============================================================
  build-backend:
    name: 🔧 Backend Analysis & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔑 Droits mvnw
        run: chmod +x mvnw

      - name: 🔍 Lint & Compilation
        run: ./mvnw compile

      - name: 🧪 Tests Unitaires
        run: ./mvnw test -Dspring.profiles.active=test

      - name: 📊 Génération Rapport Couverture
        run: ./mvnw jacoco:report

      - name: 📦 Sauvegarde Artefact Couverture
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml

      - name: 🐳 Connexion Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Push Image Docker Backend
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-backend:latest

  # ============================================================
  # Job 2 : Frontend Web Angular
  # ============================================================
  build-frontend-web:
    name: 🌐 Web Analysis & Build
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: 📦 Installation Dépendances (Sync)
        working-directory: ./frontend-web
        run: npm install --legacy-peer-deps

      - name: 🔍 Analyse Statique (Lint)
        working-directory: ./frontend-web
        run: npx ng lint || echo "Lint step skipped (no eslint config found)"

      - name: 🧪 Tests & Couverture
        working-directory: ./frontend-web
        run: npm run test:coverage

      - name: 🏗️ Build Production
        working-directory: ./frontend-web
        run: npm run build -- --configuration production

      - name: 📦 Sauvegarde Artefact Couverture
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: frontend-web/coverage/lcov.info

      - name: 🐳 Connexion Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Push Image Docker Web
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-web
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect-web:latest

  # ============================================================
  # Job 3 : Frontend Mobile Flutter
  # ============================================================
  build-frontend-mobile:
    name: 📱 Mobile Analysis & Build
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Installation Dépendances
        working-directory: ./frontend-mobile
        run: flutter pub get

      - name: 🔍 Analyse Statique (Lint)
        working-directory: ./frontend-mobile
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Tests & Couverture
        working-directory: ./frontend-mobile
        run: flutter test --coverage

      - name: 📦 Sauvegarde Artefact Couverture
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: frontend-mobile/coverage/lcov.info

      - name: 🏗️ Build APK Release
        working-directory: ./frontend-mobile
        run: flutter build apk --release

      - name: 📦 Sauvegarde APK
        uses: actions/upload-artifact@v4
        with:
          name: carrefourconnect-android-apk
          path: frontend-mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================
  # Job 4 : Sécurité & Qualité (SonarQube Cloud)
  # ============================================================
  sonarcloud:
    name: 🛡️ Security & Quality Gate
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend-web, build-frontend-mobile]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Récupération des rapports de couverture
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: 🏗️ Organisation des rapports
        run: |
          mkdir -p backend/target/site/jacoco
          mv jacoco-report/jacoco.xml backend/target/site/jacoco/jacoco.xml
          
          mkdir -p frontend-web/coverage
          mv web-coverage/lcov.info frontend-web/coverage/lcov.info
          
          mkdir -p frontend-mobile/coverage
          mv mobile-coverage/lcov.info frontend-mobile/coverage/lcov.info

      - name: 🛡️ Analyse SonarCloud
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
