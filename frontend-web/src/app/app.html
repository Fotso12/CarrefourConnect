<div class="min-h-screen bg-[#f8fafc] flex flex-col font-sans">
  <header *ngIf="!isDashboardMode" class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-[1001] px-4 md:px-8 py-4 flex justify-between items-center h-[72px]">
    <!-- Logo -->
    <div class="flex items-center cursor-pointer" routerLink="/">
      <span class="text-2xl font-extrabold tracking-tighter italic">
        <span class="text-[#034d92]">Carrefour</span><span class="text-[#f97316]">Connect</span>
      </span>
    </div>
    
    <!-- Navigation (centered in image) -->
    <nav class="absolute left-1/2 -translate-x-1/2 hidden md:flex items-center space-x-10 text-[13px] font-bold text-slate-500 uppercase tracking-widest">
      <a routerLink="/" class="hover:text-[#034d92] transition" routerLinkActive="text-[#034d92]" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
      <a routerLink="/a-propos" class="hover:text-[#034d92] transition cursor-pointer" routerLinkActive="text-[#034d92]">À propos</a>
      
      <ng-container *ngIf="isLoggedIn">
        <a *ngIf="currentUserRole === 'ADMIN' || currentUserRole === 'ROLE_ADMIN'" routerLink="/admin" class="hover:text-[#034d92] transition" routerLinkActive="text-[#034d92]">Espace Admin</a>
        <a *ngIf="currentUserRole !== 'ADMIN' && currentUserRole !== 'ROLE_ADMIN'" routerLink="/commercant" class="hover:text-[#034d92] transition" routerLinkActive="text-[#034d92]">Mon espace</a>
      </ng-container>
    </nav>

    <!-- Right Actions -->
    <div class="hidden md:flex items-center space-x-3">
      <ng-container *ngIf="!isLoggedIn">
        <button [routerLink]="['/connexion']" class="px-5 py-2.5 text-sm font-bold text-slate-600 hover:text-[#034d92] transition">Connexion</button>
        <button [routerLink]="['/inscription-commercant']" class="bg-[#034d92] text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-[#023a6e] transition">Inscription</button>
      </ng-container>
      <ng-container *ngIf="isLoggedIn">
        <button (click)="openLogout()" class="px-5 py-2.5 text-sm font-bold text-red-500 hover:text-red-700 transition">Déconnexion</button>
      </ng-container>
    </div>

    <!-- Hamburger -->
    <button (click)="toggleMobileMenu()" class="md:hidden p-2 text-[#034d92] hover:bg-slate-50 rounded-xl transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path *ngIf="!showMobileMenu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        <path *ngIf="showMobileMenu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </header>

  <!-- Mobile Menu Drawer -->
  <div *ngIf="showMobileMenu" class="md:hidden fixed inset-0 top-[72px] bg-white z-[1000] animate-in slide-in-from-top duration-300">
    <div class="p-6 space-y-6">
      <nav class="flex flex-col space-y-4">
        <a routerLink="/" (click)="closeMobileMenu()" class="text-xl font-black text-[#034d92] p-4 bg-slate-50 rounded-2xl">Accueil</a>
        <a routerLink="/a-propos" (click)="closeMobileMenu()" class="text-xl font-black text-[#034d92] p-4 bg-slate-50 rounded-2xl">À propos</a>
        
        <ng-container *ngIf="isLoggedIn">
          <a *ngIf="currentUserRole === 'ADMIN' || currentUserRole === 'ROLE_ADMIN'" 
             routerLink="/admin" (click)="closeMobileMenu()" 
             class="text-xl font-black text-[#034d92] p-4 bg-slate-50 rounded-2xl">Mon espace Admin</a>
          <a *ngIf="currentUserRole !== 'ADMIN' && currentUserRole !== 'ROLE_ADMIN'" 
             routerLink="/commercant" (click)="closeMobileMenu()" 
             class="text-xl font-black text-[#f97316] p-4 bg-orange-50 rounded-2xl">Mon espace</a>
        </ng-container>
      </nav>

      <div class="pt-6 border-t border-slate-100 flex flex-col gap-4">
        <ng-container *ngIf="!isLoggedIn">
          <button [routerLink]="['/connexion']" (click)="closeMobileMenu()" class="w-full text-[#034d92] font-bold py-4 bg-slate-50 rounded-2xl">Connexion</button>
          <button [routerLink]="['/inscription-commercant']" (click)="closeMobileMenu()" class="w-full bg-[#034d92] text-white py-4 rounded-2xl font-bold shadow-md hover:bg-[#023a6e]">Inscription</button>
        </ng-container>
        <ng-container *ngIf="isLoggedIn">
          <button (click)="openLogout(); closeMobileMenu()" class="w-full text-red-600 font-bold py-4 bg-red-50 rounded-2xl">Déconnexion</button>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div *ngIf="showLogoutModal" class="fixed inset-0 z-[1100] flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl p-6 w-11/12 max-w-md shadow-lg">
      <h3 class="text-lg font-bold text-[#034d92] mb-2">Confirmer la déconnexion</h3>
      <p class="text-sm text-gray-500 mb-6">Êtes-vous sûr de vouloir vous déconnecter ?</p>
      <div class="flex justify-end space-x-3">
        <button (click)="cancelLogout()" class="px-4 py-2 rounded-xl border border-gray-200">Annuler</button>
        <button (click)="confirmLogout()" class="px-4 py-2 rounded-xl bg-red-600 text-white font-bold">Se déconnecter</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>
</div>
