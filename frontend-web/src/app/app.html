<div class="min-h-screen bg-gray-50 flex flex-col font-sans">
  <!-- Header Principal -->
  <header class="bg-white border-b border-gray-100 flex-shrink-0 sticky top-0 z-[1001]">
    <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
      <!-- Logo et Branding -->
      <div class="flex items-center space-x-3 cursor-pointer" routerLink="/">
        <img src="/logo.png" alt="CarrefourConnect" class="h-12 w-12 object-contain">
        <span class="text-2xl font-black text-[#003B71] tracking-tighter">Carrefour<span class="text-[#F78F1E]">Connect</span></span>
      </div>
      
      <!-- Navigation -->
      <nav class="hidden md:flex items-center space-x-8">
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/" class="text-[#003B71] font-semibold hover:text-[#F78F1E] transition-colors">Accueil</a>
          <a class="text-gray-500 font-medium hover:text-[#003B71] transition-colors cursor-pointer">Catégories</a>
          <a class="text-gray-500 font-medium hover:text-[#003B71] transition-colors cursor-pointer">Aide</a>
        </ng-container>
        <ng-container *ngIf="isLoggedIn">
          <a routerLink="/commercant" class="text-[#003B71] font-semibold hover:text-[#F78F1E] transition-colors">Mon espace</a>
        </ng-container>
      </nav>

      <!-- Boutons d'Action -->
      <div class="flex items-center space-x-4">
        <ng-container *ngIf="!isLoggedIn">
          <button [routerLink]="['/connexion']" class="text-[#003B71] font-bold px-4 py-2 hover:bg-gray-50 rounded-xl transition-colors">Connexion</button>
          <button [routerLink]="['/inscription-commercant']" class="bg-[#003B71] text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-900/20 hover:scale-105 active:scale-95 transition-all">S'inscrire</button>
        </ng-container>
        <ng-container *ngIf="isLoggedIn">
          <button (click)="openLogout()" class="text-red-600 font-bold px-4 py-2 hover:bg-red-50 rounded-xl transition-colors">Déconnexion</button>
        </ng-container>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-100 py-10 mt-20">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-gray-400 text-sm">© 2024 CarrefourConnect - Trouvez les commerces près de chez vous.</p>
    </div>
  </footer>

  <!-- Logout Confirmation Modal -->
  <div *ngIf="showLogoutModal" class="fixed inset-0 z-[1100] flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl p-6 w-11/12 max-w-md shadow-lg">
      <h3 class="text-lg font-bold text-[#003B71] mb-2">Confirmer la déconnexion</h3>
      <p class="text-sm text-gray-500 mb-6">Êtes-vous sûr de vouloir vous déconnecter ?</p>
      <div class="flex justify-end space-x-3">
        <button (click)="cancelLogout()" class="px-4 py-2 rounded-xl border border-gray-200">Annuler</button>
        <button (click)="confirmLogout()" class="px-4 py-2 rounded-xl bg-red-600 text-white font-bold">Se déconnecter</button>
      </div>
    </div>
  </div>
</div>
