<div class="flex h-screen bg-[#F8FAFC] relative overflow-hidden">
  
  <!-- Overlay (Mobile uniquement) -->
  <div *ngIf="isSidebarOpen" 
       (click)="toggleSidebar()" 
       class="lg:hidden fixed inset-0 bg-black/50 z-[45] backdrop-blur-sm transition-opacity">
  </div>

  <!-- Sidebar -->
  <aside [class.translate-x-0]="isSidebarOpen"
         [class.-translate-x-full]="!isSidebarOpen"
         class="fixed inset-y-0 left-0 w-72 bg-[#003B71] text-white transition-all duration-300 flex flex-col shadow-2xl z-50 lg:relative lg:translate-x-0">
    
    <!-- Header Sidebar -->
    <div class="h-20 flex items-center px-6 gap-3 border-b border-white/10 shrink-0">
        <i class="fa-solid fa-store-slash text-white text-2xl"></i>
        <span class="text-xl font-black tracking-tight whitespace-nowrap">Commerçant</span>
    </div>

    <nav class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
      <a *ngFor="let item of menuItems" 
         [routerLink]="[item.link]" 
         routerLinkActive="bg-[#F78F1E] text-white shadow-lg"
         #rla="routerLinkActive"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="onNavItemClick()"
         class="flex items-center gap-4 px-6 py-4 rounded-2xl transition-all duration-300 group hover:bg-orange-50/50">
        <div class="flex items-center justify-center w-6 h-6">
            <i [class]="item.icon + ' text-lg'" [class.text-white]="rla.isActive"></i>
        </div>
        <span class="font-bold text-sm">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Footer Sidebar (User) -->
    <div class="p-4 border-t border-white/10">
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 hover:bg-white/10 cursor-pointer transition-all">
        <div class="h-10 w-10 rounded-xl bg-[#F78F1E] flex items-center justify-center font-bold text-lg">{{ displayName ? (displayName.charAt(0) || 'D') : 'D' }}</div>
        <div *ngIf="isSidebarOpen" class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate">{{ displayName || 'Mon Compte' }}</p>
          <p class="text-[10px] text-blue-300 truncate">{{ displayRole ? (displayRole.replace('ROLE_', '') ) : 'Commerçant' }}</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Contenu Principal -->
  <div class="flex-1 flex flex-col overflow-hidden">
    
    <!-- Top Bar -->
    <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 shrink-0">
      <button (click)="toggleSidebar()" class="p-2.5 bg-gray-50 rounded-xl text-gray-400 hover:text-[#003B71] transition-all">
        <i class="fa-solid fa-bars text-xl"></i>
      </button>

      <div class="flex items-center gap-6">
        <div class="flex flex-col items-end hidden sm:flex">
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Dernière visite</span>
          <span class="text-xs font-bold text-[#003B71]">Aujourd'hui, 11:45</span>
        </div>
        <button [routerLink]="['/commercant/notifications']" class="relative p-2.5 bg-gray-50 rounded-xl text-gray-400 hover:text-[#F78F1E] transition-all">
          <div *ngIf="unreadCount > 0" class="absolute top-2 right-2.5 h-2 w-2 bg-red-500 rounded-full border-2 border-white animate-ping"></div>
          <div *ngIf="unreadCount > 0" class="absolute top-2 right-2.5 h-2 w-2 bg-red-500 rounded-full border-2 border-white"></div>
          <i class="fa-solid fa-bell text-xl"></i>
        </button>
      </div>
    </header>

    <!-- Zone de Contenu Dynamique -->
    <main class="flex-1 overflow-y-auto p-8 bg-[#F8FAFC]">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
