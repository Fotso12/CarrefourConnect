<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-[40px] shadow-2xl p-10 border border-gray-100 animate-in fade-in zoom-in duration-500">
    
    <div class="text-center mb-10">
      <img src="/logo.png" alt="Logo" class="h-16 w-16 mx-auto mb-6">
      <h1 class="text-3xl font-black text-[#003B71]">De retour !</h1>
      <p class="text-gray-400 font-medium mt-2">Accédez à votre espace CarrefourConnect</p>
    </div>

    <div *ngIf="error" class="bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-sm font-bold border border-red-100">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Email</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" required 
               class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-[#003B71] transition-all">
      </div>

      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Mot de passe</label>
        <input type="password" name="password" [(ngModel)]="credentials.password" required 
               class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-[#003B71] transition-all">
      </div>

      <div class="text-right">
        <a routerLink="/auth/mot-de-passe-oublie" class="text-sm font-bold text-[#F78F1E]">Mot de passe oublié ?</a>
      </div>

      <div class="pt-4">
        <button type="submit" [disabled]="loading"
                class="w-full bg-[#003B71] text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-900/10 hover:bg-[#00ADEF] transition-all active:scale-95">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </div>

      <p class="text-center text-sm text-gray-500">
        Pas encore de compte ? 
        <a routerLink="/inscription-commercant" class="text-[#F78F1E] font-bold hover:underline">Devenir commerçant</a>
      </p>
    </form>
  </div>
</div>

<!-- Success Modal -->
<div *ngIf="showSuccessModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-lg text-center">
    <div class="mb-4">
      <h3 class="text-lg font-bold text-[#003B71]">Succès</h3>
      <p class="text-sm text-gray-500">{{ successMessage }}</p>
    </div>
    <div class="flex justify-center">
      <button (click)="showSuccessModal = false" class="px-4 py-2 rounded-xl bg-[#003B71] text-white font-bold">OK</button>
    </div>
  </div>
</div>

<!-- Error Modal -->
<div *ngIf="showErrorModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
  <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-lg text-center">
    <div class="mb-4">
      <h3 class="text-lg font-bold text-red-600">Erreur</h3>
      <p class="text-sm text-gray-500">{{ error }}</p>
    </div>
    <div class="flex justify-center">
      <button (click)="showErrorModal = false" class="px-4 py-2 rounded-xl border border-gray-200">Fermer</button>
    </div>
  </div>
</div>
