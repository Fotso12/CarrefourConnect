<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-[40px] shadow-2xl p-10 border border-gray-100">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-[#003B71]">Vérifier le code</h1>
      <p class="text-gray-400 mt-2">Entrez le code à 5 chiffres reçu par email.</p>
    </div>

    <form (ngSubmit)="verifier()" class="space-y-4">
      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Email</label>
        <input [(ngModel)]="email" name="email" required class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-[#003B71]" placeholder="Votre email" />
      </div>
      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Code</label>
        <input [(ngModel)]="code" name="code" required class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-[#003B71]" placeholder="Code à 5 chiffres" />
      </div>
      <div>
        <button type="submit" class="w-full bg-[#F78F1E] text-white font-bold py-4 rounded-2xl" [disabled]="loading">{{ loading ? 'Vérification...' : 'Vérifier' }}</button>
      </div>
      <p *ngIf="error" class="mt-3 text-sm text-red-600">{{ error }}</p>
    </form>
  </div>
</div>
