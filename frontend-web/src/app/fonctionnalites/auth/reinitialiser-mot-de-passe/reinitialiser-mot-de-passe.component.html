<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-[40px] shadow-2xl p-10 border border-gray-100">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-[#003B71]">Réinitialiser le mot de passe</h1>
      <p class="text-gray-400 mt-2">Entrez votre nouveau mot de passe.</p>
    </div>

    <form (ngSubmit)="submit()" class="space-y-4">
      <!-- email is prefilled from navigation state, keep hidden for UX -->
      <input type="hidden" [(ngModel)]="email" name="email" />
      <!-- token is provided by previous step, keep hidden to avoid exposing GUID -->
      <input type="hidden" [(ngModel)]="token" name="token" />

      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="nouveau" name="nouveau" required class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-[#003B71]" placeholder="Nouveau mot de passe" />
      </div>

      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2">Confirmer le mot de passe</label>
        <input type="password" [(ngModel)]="confirm" name="confirm" required class="w-full bg-gray-50 border-none rounded-2xl px-6 py-4 text-sm focus:ring-2 focus:ring-[#003B71]" placeholder="Confirmer le mot de passe" />
      </div>

      <div>
        <button type="submit" class="w-full bg-[#F78F1E] text-white font-bold py-4 rounded-2xl" [disabled]="loading">{{ loading ? 'Traitement...' : 'Réinitialiser' }}</button>
      </div>

      <p *ngIf="error" class="mt-3 text-sm text-red-600">{{ error }}</p>
    </form>
  </div>
</div>
