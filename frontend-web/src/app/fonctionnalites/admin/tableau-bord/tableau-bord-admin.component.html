<div class="flex h-screen bg-[#F8FAFC]">
  
  <!-- Sidebar Admin (Design spécifique pour différencier) -->
  <aside class="w-72 bg-[#1E293B] text-white flex flex-col shadow-2xl z-50">
    <div class="h-20 flex items-center px-8 gap-3 border-b border-white/5">
      <div class="h-10 w-10 bg-[#00ADEF] rounded-xl flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
      </div>
      <span class="text-xl font-black tracking-tight text-white">Admin Console</span>
    </div>

    <nav class="flex-1 py-10 px-6 space-y-3">
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.link" 
         routerLinkActive="bg-white/10 text-[#00ADEF] border-l-4 border-[#00ADEF]"
         class="flex items-center gap-4 px-4 py-4 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-all group overflow-hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
        </svg>
        <span class="font-bold text-sm">{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-10 shrink-0">
      <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Back-office CarrefourConnect</h2>
      <button class="bg-slate-50 text-slate-500 px-6 py-2.5 rounded-xl font-bold text-xs hover:bg-red-50 hover:text-red-500 transition-all">Déconnexion</button>
    </header>

    <main class="flex-1 overflow-y-auto p-12">
      <router-outlet></router-outlet>
      <!-- Message de Bienvenue Placeholder -->
      <div class="bg-white p-16 rounded-[40px] text-center border-2 border-dashed border-gray-100">
          <h2 class="text-4xl font-black text-slate-800 mb-4">Bienvenue, Administrateur</h2>
          <p class="text-slate-400 max-w-lg mx-auto font-medium">Ici vous pouvez modérer les nouveaux commerces, gérer les catégories et superviser l'activité globale de la plateforme.</p>
      </div>
    </main>
  </div>
</div>
