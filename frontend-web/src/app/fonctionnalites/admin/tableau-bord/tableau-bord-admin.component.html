<div class="flex h-screen bg-[#F8FAFC] relative overflow-hidden">
  
  <!-- Overlay (Mobile uniquement) -->
  <div *ngIf="isSidebarOpen" 
       (click)="toggleSidebar()" 
       class="md:hidden fixed inset-0 bg-black/50 z-[45] backdrop-blur-sm transition-opacity">
  </div>

  <!-- Sidebar Admin -->
  <aside [class.translate-x-0]="isSidebarOpen"
         [class.-translate-x-full]="!isSidebarOpen"
         class="fixed inset-y-0 left-0 w-72 bg-[#1E293B] text-white flex flex-col shadow-2xl z-50 md:relative md:translate-x-0 transition-transform duration-300">
    <div class="h-20 flex items-center px-8 gap-3 border-b border-white/5">
      <div class="h-10 w-10 bg-[#00ADEF] rounded-xl flex items-center justify-center">
          <i class="fa-solid fa-user-gear text-white text-xl"></i>
      </div>
      <span class="text-xl font-black tracking-tight text-white">Admin</span>
    </div>

    <nav class="flex-1 py-10 px-6 space-y-3">
      <a *ngFor="let item of menuItems" 
         [routerLink]="[item.link]" 
         routerLinkActive="bg-[#003B71] text-white shadow-lg"
         #rla="routerLinkActive"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="isSidebarOpen = false"
         class="flex items-center gap-4 px-6 py-4 rounded-2xl transition-all duration-300 group hover:bg-slate-700/50">
        <div class="flex items-center justify-center w-6 h-6">
            <i [class]="item.icon + ' text-lg'" [class.text-white]="rla.isActive"></i>
        </div>
        <span class="font-bold text-sm flex-1">{{ item.label }}</span>
        <span *ngIf="item.badge && pendingValidationsCount > 0" 
              class="bg-red-500 text-white text-xs font-black px-2.5 py-1 rounded-full shadow-lg shadow-red-500/30 animate-pulse">
          {{ pendingValidationsCount }}
        </span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-6 md:px-10 shrink-0">
      <div class="flex items-center gap-4">
        <!-- Button Toggle (Mobile) -->
        <button (click)="toggleSidebar()" class="md:hidden p-2 bg-slate-50 rounded-xl text-slate-400 hover:text-[#00ADEF]">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest hidden sm:block">Back-office</h2>
      </div>
      
      <!-- Zone Actions Admin -->
      <div class="flex items-center gap-4 md:gap-6">
        <!-- Notification Bell -->
        <a routerLink="/admin/notifications" class="relative p-2 text-slate-400 hover:text-[#00ADEF] transition-colors rounded-full hover:bg-slate-50 cursor-pointer">
          <i class="fa-solid fa-bell text-xl"></i>
          <span *ngIf="unreadCount > 0" class="absolute top-0 right-0 h-4 w-4 bg-red-500 rounded-full text-[10px] font-bold text-white flex items-center justify-center border-2 border-white">
            {{ unreadCount }}
          </span>
        </a>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-12 bg-slate-50/30">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
