<div class="flex flex-col h-[calc(100vh-80px)] overflow-hidden">
  <!-- Section Barre de Recherche (Placée sous le Header Shell) -->
  <div class="bg-white border-b border-gray-100 py-4 px-6 shadow-sm z-40">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-4">
      <div class="flex-1 w-full">
        <div class="bg-gray-50 p-1.5 rounded-2xl flex items-center gap-2 border border-gray-200">
          <input 
            type="text" 
            [(ngModel)]="filtres.nom"
            (ngModelChange)="onFilterChange()"
            (keyup.enter)="rechercher()"
            placeholder="Quel commerce cherchez-vous ?" 
            class="flex-1 bg-transparent border-none focus:ring-0 px-4 py-2 text-sm"
          >
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          <select 
            [(ngModel)]="filtres.idCategorie"
            (ngModelChange)="onFilterChange()"
            (change)="rechercher()"
            class="bg-transparent border-none focus:ring-0 py-2 text-sm text-gray-600 min-w-[150px]"
          >
            <option value="">Toutes catégories</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</option>
          </select>
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          <input 
            type="text" 
            [(ngModel)]="filtres.ville"
            (ngModelChange)="onFilterChange()"
            (keyup.enter)="rechercher()"
            placeholder="Ville (ex: Douala)" 
            class="bg-transparent border-none focus:ring-0 py-2 text-sm text-gray-600 w-32"
          >
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          <div class="flex items-center gap-2 px-2">
            <span class="text-[10px] text-gray-400 font-bold uppercase">Rayon</span>
            <input 
              type="number" 
              [(ngModel)]="filtres.rayon"
              (ngModelChange)="onFilterChange()"
              (change)="rechercher()"
              class="w-12 bg-transparent border-none focus:ring-0 py-2 text-sm font-bold text-[#003B71]"
              min="1" max="100"
            >
            <span class="text-[10px] text-gray-400 font-bold">km</span>
          </div>
          <button 
            (click)="rechercher()"
            class="bg-[#F78F1E] hover:bg-orange-600 text-white p-2.5 rounded-xl transition-all shadow-md active:scale-95"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Bouton Inscription (Doublon facultatif ici, mais utile pour l'engagement) -->
      <button routerLink="/inscription-commercant" class="bg-[#F78F1E]/10 text-[#F78F1E] px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-[#F78F1E]/20 transition-all hidden lg:block">
        + Ajouter un commerce
      </button>
    </div>
  </div>

  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- Liste des Commerces (Section Principale - Élargie) -->
    <div class="flex-1 bg-white p-6 overflow-y-auto border-r border-gray-100 shadow-sm z-10">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-3xl font-black text-[#003B71]">Découvrir</h2>
          <p class="text-gray-400 text-sm font-medium">{{ commerces.length }} pépites locales à explorer</p>
        </div>
      </div>

      <!-- Grille de Cartes - Plus large -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let commerce of commerces" 
             class="bg-white rounded-[32px] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-gray-50 group cursor-pointer relative">
          <!-- Zone Image / Carrousel -->
          <div class="h-48 bg-gray-200 relative overflow-hidden group/image">
            <ng-container *ngIf="commerce.images && commerce.images.length > 0; else placeholder">
              <img [src]="commerce.images[commerce.currentImg].url" 
                   alt="Image du commerce" 
                   class="w-full h-full object-cover transition-all duration-700">
              
              <!-- Contrôles Carrousel -->
              <div *ngIf="commerce.images.length > 1" class="absolute inset-0 flex items-center justify-between px-3">
                <button (click)="prevImage(commerce, $event)" class="w-8 h-8 rounded-full bg-white/90 backdrop-blur shadow-md flex items-center justify-center text-[#003B71] hover:bg-white transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <button (click)="nextImage(commerce, $event)" class="w-8 h-8 rounded-full bg-white/90 backdrop-blur shadow-md flex items-center justify-center text-[#003B71] hover:bg-white transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
                </button>
              </div>
            </ng-container>

            <ng-template #placeholder>
              <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=400" 
                   class="w-full h-full object-cover grayscale opacity-50">
            </ng-template>

            <div class="absolute top-4 left-4">
                <span class="bg-white/80 backdrop-blur text-[#003B71] px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider">
                    {{ commerce.categorie?.nom }}
                </span>
            </div>
          </div>
          <div class="p-6">
            <h3 class="text-lg font-black text-[#003B71] mb-2 group-hover:text-[#F78F1E] transition-colors line-clamp-1">{{ commerce.nom }}</h3>
            <p class="text-gray-400 text-[11px] leading-relaxed mb-6 line-clamp-2 h-8 font-medium">{{ commerce.description }}</p>
            
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /></svg>
                <span class="text-[11px] font-bold">{{ commerce.ville }}</span>
              </div>
              <button [routerLink]="['/commerce', commerce.idcommerce]" 
                      class="bg-[#003B71] text-white px-5 py-2.5 rounded-2xl text-[11px] font-black hover:bg-[#00ADEF] transition-all shadow-lg shadow-blue-900/10">
                Détails
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Carte (Section Droite - Réduite) -->
    <div class="w-full md:w-[320px] lg:w-[380px] relative bg-gray-50 border-l border-gray-100 flex flex-col">
      <div class="h-[250px] md:h-full relative">
        <app-carte [points]="pointsCarte" class="h-full"></app-carte>
      </div>
      
      <!-- Bouton Inscription Rapide sous la map (desktop) -->
      <div class="hidden md:block p-6 mt-auto">
        <div class="bg-gradient-to-br from-[#003B71] to-[#00ADEF] rounded-3xl p-6 text-white shadow-xl">
           <p class="text-xs font-black uppercase tracking-widest mb-2 opacity-80">Vous êtes commerçant ?</p>
           <h4 class="text-lg font-black mb-4">Rejoignez l'annuaire dès aujourd'hui</h4>
           <button routerLink="/inscription-commercant" 
                   class="w-full bg-white text-[#003B71] py-3 rounded-xl font-black text-xs hover:bg-orange-50 transition-all">
             Inscrire mon commerce
           </button>
        </div>
      </div>
    </div>
      <!-- Bouton Flottant (Vue Mobile) -->
      <button class="absolute bottom-8 right-8 md:hidden bg-[#003B71] text-white p-4 rounded-full shadow-2xl z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
  </main>
</div>
