<div class="flex flex-col h-[calc(100vh-80px)] overflow-hidden">
  <!-- Section Barre de Recherche (Placée sous le Header Shell) -->
  <div class="bg-white border-b border-gray-100 py-4 px-6 shadow-sm z-40">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-4">
      <div class="flex-1 w-full">
        <div class="bg-gray-50 p-1.5 rounded-2xl flex items-center gap-2 border border-gray-200">
          <input 
            type="text" 
            [(ngModel)]="filtres.nom"
            (keyup.enter)="rechercher()"
            placeholder="Quel commerce cherchez-vous ?" 
            class="flex-1 bg-transparent border-none focus:ring-0 px-4 py-2 text-sm"
          >
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          <select 
            [(ngModel)]="filtres.idCategorie"
            (change)="rechercher()"
            class="bg-transparent border-none focus:ring-0 py-2 text-sm text-gray-600 min-w-[150px]"
          >
            <option value="">Toutes catégories</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</option>
          </select>
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          <div class="flex items-center gap-2 px-2">
            <span class="text-[10px] text-gray-400 font-bold uppercase">Rayon</span>
            <input 
              type="number" 
              [(ngModel)]="filtres.rayon"
              (change)="rechercher()"
              class="w-16 bg-transparent border-none focus:ring-0 py-2 text-sm font-bold text-[#003B71]"
              min="1" max="100"
            >
            <span class="text-[10px] text-gray-400 font-bold">km</span>
          </div>
          <button 
            (click)="rechercher()"
            class="bg-[#F78F1E] hover:bg-orange-600 text-white p-2.5 rounded-xl transition-all shadow-md active:scale-95"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Bouton Inscription (Doublon facultatif ici, mais utile pour l'engagement) -->
      <button routerLink="/inscription-commercant" class="bg-[#F78F1E]/10 text-[#F78F1E] px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-[#F78F1E]/20 transition-all hidden lg:block">
        + Ajouter un commerce
      </button>
    </div>
  </div>

  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- Liste des Commerces (Section Gauche) -->
    <div class="w-full md:w-[450px] lg:w-[500px] bg-white p-6 overflow-y-auto border-r border-gray-100 shadow-xl z-10">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-2xl font-black text-[#003B71]">Commerces</h2>
          <p class="text-gray-400 text-sm font-medium">{{ commerces.length }} établissements trouvés</p>
        </div>
        <div class="flex gap-2">
            <button class="p-2 bg-gray-50 rounded-lg hover:bg-gray-100 text-gray-400 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                </svg>
            </button>
        </div>
      </div>

      <!-- Grille de Cartes -->
      <div class="space-y-6">
        <div *ngFor="let commerce of commerces" 
             class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-300 border border-gray-100 group cursor-pointer relative">
          <div class="h-44 bg-gray-200 relative overflow-hidden">
            <img [src]="commerce.imagePrincipale || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=400'" 
                 alt="Image du commerce" 
                 class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
            <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/60 to-transparent"></div>
            <div class="absolute bottom-4 left-4">
                <span class="bg-white/20 backdrop-blur-md border border-white/30 text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
                    {{ commerce.categorie?.nom }}
                </span>
            </div>
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold text-[#003B71] mb-2 group-hover:text-[#F78F1E] transition-colors line-clamp-1">{{ commerce.nom }}</h3>
            <p class="text-gray-500 text-xs leading-relaxed mb-6 line-clamp-2 h-8">{{ commerce.description }}</p>
            
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-full bg-blue-50 flex items-center justify-center text-[#00ADEF]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    </svg>
                </div>
                <span class="text-gray-500 text-xs font-bold">{{ commerce.ville }}</span>
              </div>
              <button class="bg-[#003B71] text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-[#00ADEF] transition-all shadow-md">
                Détails
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Carte (Section Droite) -->
    <div class="flex-1 relative bg-gray-100">
      <app-carte [points]="pointsCarte" class="h-full"></app-carte>
      <!-- Bouton Flottant (Vue Mobile) -->
      <button class="absolute bottom-8 right-8 md:hidden bg-[#003B71] text-white p-4 rounded-full shadow-2xl z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </div>
  </main>
</div>
