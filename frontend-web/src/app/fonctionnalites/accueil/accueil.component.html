<div class="flex flex-col h-[calc(100vh-80px)] overflow-hidden">
  <!-- Section Barre de Recherche (Placée sous le Header Shell) -->
  <div class="bg-white border-b border-gray-100 py-4 px-6 shadow-sm z-40">
    <div class="max-w-7xl mx-auto">
      <div class="bg-gray-50 p-1.5 rounded-[24px] flex flex-col md:flex-row items-stretch md:items-center gap-2 border border-gray-200">
        <!-- Champ Recherche Nom -->
        <input 
          type="text" 
          [(ngModel)]="filtres.nom"
          (ngModelChange)="onFilterChange()"
          (keyup.enter)="rechercher()"
          placeholder="Commerce..." 
          class="flex-1 bg-transparent border-none focus:ring-0 px-4 py-2.5 text-sm"
        >
        
        <div class="flex flex-wrap md:flex-nowrap items-center gap-2 px-2 pb-2 md:pb-0">
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          
          <!-- Catégorie -->
          <select 
            [(ngModel)]="filtres.idCategorie"
            (ngModelChange)="onFilterChange()"
            (change)="rechercher()"
            class="bg-transparent border-none focus:ring-0 py-2.5 text-xs text-gray-600 min-w-[120px] flex-1"
          >
            <option value="">Toutes catégories</option>
            <option *ngFor="let cat of categories" [value]="cat.idcategorie">{{ cat.nom }}</option>
          </select>
          
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          
          <!-- Ville -->
          <input 
            type="text" 
            [(ngModel)]="filtres.ville"
            (ngModelChange)="onFilterChange()"
            (keyup.enter)="rechercher()"
            placeholder="Ville" 
            class="bg-transparent border-none focus:ring-0 py-2.5 text-xs text-gray-600 w-24 flex-1"
          >
          
          <div class="h-8 w-px bg-gray-200 hidden md:block"></div>
          
          <!-- Rayon -->
          <div class="flex items-center gap-1">
            <input 
              type="number" 
              [(ngModel)]="filtres.rayon"
              (ngModelChange)="onFilterChange()"
              (change)="rechercher()"
              class="w-10 bg-transparent border-none focus:ring-0 py-2.5 text-xs font-bold text-[#003B71]"
              min="1" max="100"
            >
            <span class="text-[9px] text-gray-400 font-bold">km</span>
          </div>

          <!-- Bouton Search -->
          <button 
            (click)="rechercher()"
            class="bg-[#F78F1E] hover:bg-orange-600 text-white p-3 rounded-2xl transition-all shadow-md active:scale-95 ml-auto flex items-center justify-center w-11 h-11"
          >
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- Liste des Commerces (Section Principale - Élargie) -->
    <div class="flex-1 bg-white p-6 overflow-y-auto border-r border-gray-100 shadow-sm z-10">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h2 class="text-3xl font-black text-[#003B71]">Découvrir</h2>
          <p class="text-gray-400 text-sm font-medium">{{ commerces.length }} pépites locales à explorer</p>
        </div>
      </div>

      <!-- Grille de Cartes - Plus large -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let commerce of commerces" 
             class="bg-white rounded-[32px] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-gray-50 group cursor-pointer relative">
          <!-- Zone Image / Carrousel -->
          <div class="h-48 bg-gray-200 relative overflow-hidden group/image">
            <ng-container *ngIf="commerce.images && commerce.images.length > 0; else placeholder">
              <img [src]="commerce.images[commerce.currentImg].url" 
                   alt="Image du commerce" 
                   class="w-full h-full object-cover transition-all duration-700">
              
              <!-- Contrôles Carrousel -->
              <div *ngIf="commerce.images.length > 1" class="absolute inset-0 flex items-center justify-between px-3">
                <button (click)="prevImage(commerce, $event)" class="w-8 h-8 rounded-full bg-white/90 backdrop-blur shadow-md flex items-center justify-center text-[#003B71] hover:bg-white transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
                </button>
                <button (click)="nextImage(commerce, $event)" class="w-8 h-8 rounded-full bg-white/90 backdrop-blur shadow-md flex items-center justify-center text-[#003B71] hover:bg-white transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
                </button>
              </div>
            </ng-container>

            <ng-template #placeholder>
              <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=400" 
                   class="w-full h-full object-cover grayscale opacity-50">
            </ng-template>

            <div class="absolute top-4 left-4">
                <span class="bg-white/80 backdrop-blur text-[#003B71] px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider">
                    {{ commerce.categorie?.nom }}
                </span>
            </div>
          </div>
          <div class="p-6">
            <h3 class="text-lg font-black text-[#003B71] mb-2 group-hover:text-[#F78F1E] transition-colors line-clamp-1">{{ commerce.nom }}</h3>
            <p class="text-gray-400 text-[11px] leading-relaxed mb-6 line-clamp-2 h-8 font-medium">{{ commerce.description }}</p>
            
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 text-gray-400">
                <i class="fa-solid fa-location-dot h-3.5 w-3.5"></i>
                <span class="text-[11px] font-bold">{{ commerce.ville }}</span>
              </div>
              <button [routerLink]="['/commerce', commerce.idcommerce]" 
                      class="bg-[#003B71] text-white px-5 py-2.5 rounded-2xl text-[11px] font-black hover:bg-[#00ADEF] transition-all shadow-lg shadow-blue-900/10">
                Détails
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Carte (Cachée sur mobile si on n'a pas basculé) -->
    <div [class.hidden]="!showMapOnMobile" 
         class="md:flex w-full md:w-[320px] lg:w-[420px] relative bg-gray-50 border-l border-gray-100 flex flex-col z-20 md:static fixed inset-0 top-[140px] md:top-0">
      <div class="flex-1 relative">
        <app-carte [points]="pointsCarte" class="h-full"></app-carte>
      </div>
      
      <!-- Bouton Fermer Carte Mobile -->
      <button (click)="showMapOnMobile = false" class="md:hidden absolute top-4 right-4 bg-white p-3 rounded-full shadow-xl text-[#003B71] z-[1002]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Bouton Flottant (Vue Mobile - Switch Carte/Liste) -->
    <button (click)="showMapOnMobile = !showMapOnMobile" 
            class="md:hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-[#003B71] text-white px-6 py-3 rounded-full shadow-2xl z-[50] flex items-center gap-2 font-black text-sm active:scale-95 transition-all">
      <i [class]="showMapOnMobile ? 'fa-solid fa-list' : 'fa-solid fa-map-marked-alt'" class="text-base"></i>
      {{ showMapOnMobile ? 'Voir la liste' : 'Voir la carte' }}
    </button>
  </main>
</div>
