spring.application.name=carrefourconnect

# Configuration du serveur
server.port=8084
server.address=0.0.0.0

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/annuairenumerique
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Format de date
spring.jackson.date-format=dd.MM.YYYY HH:mm:ss

# Configuration Swagger/OpenAPI
spring.doc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# Configuration de l'upload de fichiers (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Désactiver les couleurs ANSI dans les fichiers pour éviter les erreurs d'encodage
spring.output.ansi.enabled=never

# ===== Configuration Email (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Email destinataire des notifications (email admin)
app.admin.email=${ADMIN_EMAIL}

# Type de colonne spatiale par défaut (PostGIS pour la prod)
app.spatial.column-type=geography(Point, 4326)

# URL de base de l'application pour les médias
app.base-url=http://localhost:8084