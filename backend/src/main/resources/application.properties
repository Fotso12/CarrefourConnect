spring.application.name=carrefourconnect

# Configuration du serveur
server.port=${PORT:8084}
server.address=0.0.0.0

# Configuration PostgreSQL (Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Format de date
spring.jackson.date-format=dd.MM.YYYY HH:mm:ss

# Swagger/OpenAPI
spring.doc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# Upload de fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.output.ansi.enabled=never

# ===== Email (Mailjet SMTP) =====
spring.mail.host=${MAILJET_SMTP_HOST:smtp.mailjet.com}
spring.mail.port=${MAILJET_SMTP_PORT:587}
spring.mail.username=${MAILJET_API_KEY}
spring.mail.password=${MAILJET_API_SECRET}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.admin.email=${ADMIN_EMAIL}
app.mail.from=${MAILJET_FROM_EMAIL}

# ===== Cloudinary (images) =====
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Spatial
app.spatial.column-type=geography(Point, 4326)

# URL de base
app.base-url=${APP_BASE_URL:http://localhost:8084}