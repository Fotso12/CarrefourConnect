# ============================================================
# Configuration pour les tests automatisés (profil 'test')
# Base de données H2 en mémoire - Mode compatible PostgreSQL
# ============================================================

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Type de colonne spatiale compatible H2 (évite l'erreur de syntaxe geography)
app.spatial.column-type=VARBINARY

# Autoriser l'écrasement des beans si nécessaire
spring.main.allow-bean-definition-overriding=true

# Désactiver uniquement les services externes réellement bloquants
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
  de.codecentric.boot.admin.server.config.AdminServerAutoConfiguration,\
  de.codecentric.boot.admin.server.ui.config.AdminServerUiAutoConfiguration,\
  de.codecentric.boot.admin.client.config.SpringBootAdminClientAutoConfiguration

# Valeurs factices (tests uniquement) pour les placeholders de application.properties.
# Les anciens noms (DB_USERNAME, MAIL_USERNAME, app.jwt.secret...) ne correspondaient
# plus à ce que lit l'application, d'où l'échec de contextLoads.
MAILJET_API_KEY=test-api-key
MAILJET_API_SECRET=test-api-secret
MAILJET_FROM_EMAIL=no-reply@test.local
ADMIN_EMAIL=admin@test.local
CLOUDINARY_CLOUD_NAME=test-cloud
CLOUDINARY_API_KEY=test-key
CLOUDINARY_API_SECRET=test-secret

# Clé JWT factice : HS512 exige au moins 64 octets
carrefourconnect.app.jwtSecret=cle-de-test-uniquement-ne-jamais-utiliser-en-production-0123456789abcdef
carrefourconnect.app.jwtExpirationMs=3600000

logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
