# ============================================================
# Configuration pour les tests automatisés (profil 'test')
# Base de données H2 en mémoire - pas de PostGIS
# ============================================================

# H2 Database en mémoire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte H2 standard (pas PostgreSQL/PostGIS)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Désactivation de la génération de schéma pour éviter les erreurs avec PostGIS/H2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Désactiver les auto-configurations non utilisables sans infrastructure externe
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
  de.codecentric.boot.admin.server.config.AdminServerAutoConfiguration,\
  de.codecentric.boot.admin.server.ui.config.AdminServerUiAutoConfiguration,\
  de.codecentric.boot.admin.client.config.SpringBootAdminClientAutoConfiguration

# Variables d'environnement factices pour que Spring démarre sans erreur
DB_USERNAME=sa
DB_PASSWORD=
MAIL_USERNAME=test@test.com
MAIL_PASSWORD=test
ADMIN_EMAIL=admin@test.com

# JWT secret factice pour les tests
app.jwt.secret=dGVzdHNlY3JldGtleWZvcnRlc3RzMTIzNDU2Nzg5MA==
app.jwt.expiration=3600000

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
