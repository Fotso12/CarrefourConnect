# ============================================================
# Configuration pour les tests automatisés (profil 'test')
# Base de données H2 en mémoire - Mode compatible PostgreSQL
# ============================================================

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Type de colonne spatiale compatible H2 (évite l'erreur de syntaxe geography)
app.spatial.column-type=VARBINARY

# Autoriser l'écrasement des beans si nécessaire
spring.main.allow-bean-definition-overriding=true

# Désactiver uniquement les services externes réellement bloquants
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,\
  de.codecentric.boot.admin.server.config.AdminServerAutoConfiguration,\
  de.codecentric.boot.admin.server.ui.config.AdminServerUiAutoConfiguration,\
  de.codecentric.boot.admin.client.config.SpringBootAdminClientAutoConfiguration

# Variables d'environnement factices
DB_USERNAME=sa
DB_PASSWORD=
MAIL_USERNAME=test@test.com
MAIL_PASSWORD=test
ADMIN_EMAIL=admin@test.com

# JWT secret
app.jwt.secret=dGVzdHNlY3JldGtleWZvcnRlc3RzMTIzNDU2Nzg5MA==
app.jwt.expiration=3600000

logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
