# Nom du workflow CI/CD
name: Java CI/CD avec Docker Hub

# Déclencheurs : push ou pull request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Travail de build, test et déploiement Docker
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source
    - uses: actions/checkout@v4

    # 2. Installation de l'environnement Java 17
    - name: Configuration du JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Donner les droits d'exécution au script Maven Wrapper
    - name: Rendre mvnw exécutable
      run: chmod +x mvnw

    # 4. Construction et exécution des tests unitaires
    - name: Build et Tests avec Maven
      run: ./mvnw clean test -Dspring.profiles.active=test

    # 5. Connexion au Docker Hub (nécessite les secrets configurés)
    - name: Connexion au Docker Hub
      if: success()
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 6. Construction de l'image Docker et envoi sur le registry
    - name: Construction et Push de l'image Docker
      if: success()
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/carrefourconnect:latest
