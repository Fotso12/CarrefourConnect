{{- /*
Secret créé par le chart, SAUF si secrets.existingSecret désigne un Secret déjà présent.
Les valeurs viennent d'un fichier values-secret.yaml non versionné (-f).
"required" et "fail" arrêtent l'installation avec un message clair plutôt que de
déployer une application qui planterait au démarrage.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $jwt := required "secrets.jwtSecret est obligatoire (fichier values-secret.yaml, voir values-secret.example.yaml)" .Values.secrets.jwtSecret }}
{{- if lt (len $jwt) 64 }}
{{- fail (printf "secrets.jwtSecret doit faire au moins 64 caractères pour HS512 (actuellement : %d)" (len $jwt)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carrefourconnect.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carrefourconnect.labels" . | nindent 4 }}
type: Opaque
# stringData : valeurs en clair, encodées en base64 par Kubernetes à l'enregistrement
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword est obligatoire" .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ $jwt | quote }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword est obligatoire quand redis.enabled=true" .Values.secrets.redisPassword | quote }}
  {{- end }}
  MAILJET_API_KEY: {{ .Values.secrets.mailjetApiKey | default "factice" | quote }}
  MAILJET_API_SECRET: {{ .Values.secrets.mailjetApiSecret | default "factice" | quote }}
  CLOUDINARY_API_KEY: {{ .Values.secrets.cloudinaryApiKey | default "factice" | quote }}
  CLOUDINARY_API_SECRET: {{ .Values.secrets.cloudinaryApiSecret | default "factice" | quote }}
{{- end }}
