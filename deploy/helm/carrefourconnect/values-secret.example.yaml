# ============================================================
# MODÈLE des valeurs secrètes (versionné, sans aucune vraie valeur).
#
#   Copy-Item deploy\helm\carrefourconnect\values-secret.example.yaml `
#             deploy\helm\carrefourconnect\values-secret.yaml
#   # puis remplir values-secret.yaml, qui est ignoré par Git (.gitignore)
#
# Passé à Helm avec "-f values-secret.yaml", il sert à créer le Secret Kubernetes.
# Le chart refuse de s'installer si jwtSecret ou postgresPassword manquent.
# ============================================================
secrets:
  postgresPassword: changez-moi
  # 64 caractères minimum. Génération en PowerShell :
  #   [Convert]::ToBase64String((1..64 | ForEach-Object { Get-Random -Maximum 256 }))
  jwtSecret: changez-moi-avec-une-cle-aleatoire-d-au-moins-64-caracteres-0123456789
  # Mot de passe de Redis (lettres et chiffres)
  redisPassword: changez-moi-redis
  # Facultatifs en local (l'application démarre avec des valeurs factices)
  mailjetApiKey: factice
  mailjetApiSecret: factice
  cloudinaryApiKey: factice
  cloudinaryApiSecret: factice
