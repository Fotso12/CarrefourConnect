# ============================================================
# CarrefourConnect en local avec Docker Compose
#
#   Copy-Item deploy\.env.example deploy\.env    # une seule fois, puis éditer deploy\.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#   -> application : http://localhost:8080
#
# Trois conteneurs sur un réseau privé créé par Compose, où chacun joint les autres
# par son NOM de service (db, backend, frontend) grâce au DNS interne de Docker.
# Les ${VARIABLES} viennent du fichier deploy/.env (jamais commité).
# ============================================================

name: carrefourconnect

services:

  # ---------- Base de données PostgreSQL + extension PostGIS ----------
  db:
    image: postgis/postgis:17-3.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans deploy/.env}
    volumes:
      # Volume nommé : les données survivent à "docker compose down" et aux mises à jour
      # de l'image. Seul "docker compose down -v" les efface.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready répond OK seulement quand PostgreSQL accepte des connexions.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Pas de "ports:" : la base n'est joignable que depuis le réseau Compose.
    # Pour l'ouvrir à un client SQL local, décommenter (127.0.0.1 = ta machine seulement) :
    # ports:
    #   - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------- Backend Spring Boot ----------
  backend:
    build: ../backend
    image: carrefourconnect-backend:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # attend que PostgreSQL soit prêt, pas juste démarré
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET (64 caractères min.) dans deploy/.env}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-factice}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-factice}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL:-no-reply@example.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-factice}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-factice}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-factice}
      APP_BASE_URL: http://localhost:8080
    volumes:
      # Les images envoyées par les commerçants sont écrites dans /app/uploads.
      - uploads:/app/uploads
    ports:
      # Accès direct au backend (Swagger, /actuator/health) depuis TA machine uniquement.
      # Le navigateur, lui, passe par le frontend sur le port 8080.
      - "127.0.0.1:8084:8084"
    healthcheck:
      # L'image JRE n'a ni curl ni wget : on interroge /actuator/health/readiness avec bash
      # (/dev/tcp ouvre une connexion TCP), sans rien installer de plus dans l'image.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8084 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s   # Spring Boot met du temps à démarrer : les échecs pendant 90 s ne comptent pas
    deploy:
      resources:
        limits:
          memory: 768m      # la JVM prendra 75 % de cette limite pour le tas (MaxRAMPercentage)

  # ---------- Frontend Angular servi par Nginx (+ reverse proxy) ----------
  frontend:
    build: ../frontend-web
    image: carrefourconnect-frontend:dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Remplace la config SPA de l'image par une config qui ajoute le reverse proxy
      # /api, /ws et /uploads -> backend (dans Kubernetes, c'est l'Ingress qui le fera).
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 8080 et pas 80 : le port 80 sera utilisé par le cluster k3d (étape 2).
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:
  uploads:
