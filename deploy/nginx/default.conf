# ============================================================
# Nginx pour Docker Compose : il joue le rôle que jouera l'Ingress dans Kubernetes.
#   /          -> fichiers de l'application Angular (SPA)
#   /api/      -> backend Spring Boot (REST)
#   /ws        -> backend Spring Boot (WebSocket STOMP/SockJS)
#   /uploads/  -> backend Spring Boot (images envoyées par les commerçants)
# Le navigateur ne parle qu'à UN seul domaine (http://localhost:8080) : pas de CORS,
# et le frontend utilise des chemins relatifs (environment.prod.ts).
#
# Ce fichier est monté par deploy/docker-compose.yml à la place de la config de
# l'image : l'image frontend reste une simple SPA, réutilisée telle quelle dans
# Kubernetes où c'est l'Ingress qui fait le routage.
# ============================================================

# WebSocket : si le navigateur demande "Upgrade: websocket", on transmet
# "Connection: upgrade" au backend ; sinon on ferme normalement la connexion.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le backend accepte des fichiers jusqu'à 10 Mo (spring.servlet.multipart) ;
    # Nginx refuse tout ce qui dépasse 1 Mo par défaut (erreur 413) : on aligne.
    client_max_body_size 10m;

    # DNS interne de Docker. Avec une variable dans proxy_pass, Nginx résout le nom
    # "backend" à chaque requête (toutes les 10 s au plus) au lieu d'une seule fois au
    # démarrage : si le conteneur backend redémarre et change d'IP, ça continue à marcher.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8084;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # "^~" : si ce préfixe correspond, Nginx n'évalue PAS les "location ~*" (regex) plus bas.
    # Sans lui, /uploads/photo.jpg serait capturé par la règle de cache des images
    # et cherché sur le disque de Nginx au lieu d'être demandé au backend.
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;                         # obligatoire pour WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une connexion WebSocket reste ouverte longtemps : sans ça, Nginx la coupe après 60 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # /actuator n'est volontairement PAS exposé : les sondes et Prometheus parlent
    # directement au backend, sur le réseau interne.

    # Routing Angular (HTML5 History API) : toute URL inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers statiques (leurs noms contiennent un hash).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache (il référence les nouveaux bundles).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
