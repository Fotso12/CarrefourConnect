# ============================================================
# MODÈLE de Secret : aucune vraie valeur ici, ce fichier est versionné.
#
#   Copy-Item deploy\k8s\secret.example.yaml deploy\k8s\secret.yaml
#   # éditer deploy\k8s\secret.yaml avec tes valeurs, puis :
#   kubectl apply -f deploy\k8s\secret.yaml
#
# deploy/k8s/secret.yaml est ignoré par Git (.gitignore) et volontairement ABSENT
# de kustomization.yaml : "kubectl apply -k" ne doit jamais écraser le vrai Secret
# avec ces valeurs d'exemple.
#
# Bon à savoir : un Secret Kubernetes n'est PAS chiffré, seulement encodé en base64
# (kubectl get secret ... -o yaml le montre). Sa protection repose sur les droits
# d'accès (RBAC). En production, on ajoute le chiffrement au repos (etcd) ou un
# gestionnaire externe (Sealed Secrets, External Secrets + Vault...).
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: carrefourconnect-secrets
  namespace: carrefourconnect
  labels:
    app.kubernetes.io/part-of: carrefourconnect
type: Opaque
# stringData : on écrit les valeurs en clair, Kubernetes les encode lui-même en base64.
stringData:
  POSTGRES_PASSWORD: changez-moi
  # 64 caractères minimum (HS512). Génération en PowerShell :
  #   [Convert]::ToBase64String((1..64 | ForEach-Object { Get-Random -Maximum 256 }))
  JWT_SECRET: changez-moi-avec-une-cle-aleatoire-d-au-moins-64-caracteres-0123456789
  MAILJET_API_KEY: factice
  MAILJET_API_SECRET: factice
  CLOUDINARY_API_KEY: factice
  CLOUDINARY_API_SECRET: factice
