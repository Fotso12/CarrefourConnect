# H2 Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Show SQL in logs
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Avoid PostGIS issues during tests (hibernate-spatial)
# Since we are using H2, we might need to disable spatial if H2 doesn't support it easily or use a mock.
# For unit tests, we will mostly mock repositories anyway.

logging.level.org.hibernate.SQL=DEBUG
