# ==========================================================
# SonarCloud Global Configuration for CarrefourConnect (Monorepo)
# ==========================================================
sonar.projectKey=CarrefourConnect
sonar.organization=Fotso12
sonar.host.url=https://sonarcloud.io

# Define Modules
sonar.modules=backend,frontend-web,frontend-mobile

# ----------------------------------------------------------
# Backend Module (Java/Spring Boot)
# ----------------------------------------------------------
backend.sonar.projectName=Backend
backend.sonar.projectBaseDir=backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ----------------------------------------------------------
# Frontend Web Module (Angular/TypeScript)
# ----------------------------------------------------------
frontend-web.sonar.projectName=Web
frontend-web.sonar.projectBaseDir=frontend-web
frontend-web.sonar.sources=src
frontend-web.sonar.tests=src
frontend-web.sonar.test.inclusions=**/*.spec.ts
frontend-web.sonar.exclusions=**/node_modules/**,**/dist/**
frontend-web.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ----------------------------------------------------------
# Frontend Mobile Module (Flutter/Dart)
# ----------------------------------------------------------
frontend-mobile.sonar.projectName=Mobile
frontend-mobile.sonar.projectBaseDir=frontend-mobile
frontend-mobile.sonar.sources=lib
frontend-mobile.sonar.tests=test
frontend-mobile.sonar.test.inclusions=test/**/*_test.dart
frontend-mobile.sonar.flutter.coverage.reportPath=coverage/lcov.info
